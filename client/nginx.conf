server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Vite fingerprints these filenames, so they can be cached indefinitely.
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        try_files  $uri =404;
    }

    # A single-page app owns its routing: any unmatched path has to return
    # index.html rather than a 404, or a deep link reloads into nothing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html itself must never be cached, otherwise browsers keep serving
    # a shell that references the previous build's hashed assets.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    gzip             on;
    gzip_vary        on;
    gzip_min_length  1024;
    gzip_types       text/plain text/css application/javascript application/json image/svg+xml;
}
