<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="100%" height="100%" style="background-color: #0f172a; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <text x="500" y="40" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="bold">Yucarn (UniPay) — End-to-End User Journeys</text>

  <!-- USER JOURNEY 1: MERCHANT INVOICE & PAYROLL -->
  <rect x="40" y="80" width="920" height="260" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="60" y="110" fill="#60a5fa" font-size="15" font-weight="bold">FLOW A: MERCHANT ONBOARDING, INVOICE &amp; PAYROLL (B2B PORTAL)</text>

  <g transform="translate(60, 130)">
    <rect x="0" y="0" width="190" height="180" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
    <circle cx="95" cy="35" r="20" fill="#1e3a8a"/>
    <text x="95" y="40" text-anchor="middle" fill="#60a5fa" font-size="14" font-weight="bold">1</text>
    <text x="95" y="75" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="bold">Privy Login</text>
    <text x="95" y="95" text-anchor="middle" fill="#94a3b8" font-size="11">Email / Social / Passkey</text>
    <text x="95" y="115" text-anchor="middle" fill="#38bdf8" font-size="10">Auto-Generates Wallet</text>
    <text x="95" y="135" text-anchor="middle" fill="#38bdf8" font-size="10">JWT Issued &amp; Saved</text>
  </g>

  <line x1="250" y1="220" x2="280" y2="220" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

  <g transform="translate(285, 130)">
    <rect x="0" y="0" width="190" height="180" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
    <circle cx="95" cy="35" r="20" fill="#1e3a8a"/>
    <text x="95" y="40" text-anchor="middle" fill="#60a5fa" font-size="14" font-weight="bold">2</text>
    <text x="95" y="75" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="bold">Create Invoice</text>
    <text x="95" y="95" text-anchor="middle" fill="#94a3b8" font-size="11">Input Amount ($100.00)</text>
    <text x="95" y="115" text-anchor="middle" fill="#38bdf8" font-size="10">Assigns Sub-Cent Nonce</text>
    <text x="95" y="135" text-anchor="middle" fill="#38bdf8" font-size="10">Exact Net: $100.0042</text>
  </g>

  <line x1="475" y1="220" x2="505" y2="220" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

  <g transform="translate(510, 130)">
    <rect x="0" y="0" width="190" height="180" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
    <circle cx="95" cy="35" r="20" fill="#1e3a8a"/>
    <text x="95" y="40" text-anchor="middle" fill="#60a5fa" font-size="14" font-weight="bold">3</text>
    <text x="95" y="75" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="bold">Register ENSv2</text>
    <text x="95" y="95" text-anchor="middle" fill="#94a3b8" font-size="11">Select .eth Domain</text>
    <text x="95" y="115" text-anchor="middle" fill="#38bdf8" font-size="10">2-Step Commit/Reveal</text>
    <text x="95" y="135" text-anchor="middle" fill="#38bdf8" font-size="10">Binds Arc Payout Address</text>
  </g>

  <line x1="700" y1="220" x2="730" y2="220" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

  <g transform="translate(735, 130)">
    <rect x="0" y="0" width="190" height="180" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
    <circle cx="95" cy="35" r="20" fill="#1e3a8a"/>
    <text x="95" y="40" text-anchor="middle" fill="#60a5fa" font-size="14" font-weight="bold">4</text>
    <text x="95" y="75" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="bold">Batch Payroll</text>
    <text x="95" y="95" text-anchor="middle" fill="#94a3b8" font-size="11">Select Employee List</text>
    <text x="95" y="115" text-anchor="middle" fill="#38bdf8" font-size="10">Arc Low-Fee Settlement</text>
    <text x="95" y="135" text-anchor="middle" fill="#38bdf8" font-size="10">Auto-Updates Records</text>
  </g>

  <!-- USER JOURNEY 2: BUYER CHECKOUT & CCTP SETTLEMENT -->
  <rect x="40" y="370" width="920" height="270" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
  <text x="60" y="400" fill="#6ee7b7" font-size="15" font-weight="bold">FLOW B: BUYER 1-CLICK CROSS-CHAIN CHECKOUT &amp; AUTO-RELAY</text>

  <g transform="translate(60, 420)">
    <rect x="0" y="0" width="190" height="190" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
    <circle cx="95" cy="35" r="20" fill="#064e3b"/>
    <text x="95" y="40" text-anchor="middle" fill="#6ee7b7" font-size="14" font-weight="bold">1</text>
    <text x="95" y="75" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="bold">Open Invoice Link</text>
    <text x="95" y="95" text-anchor="middle" fill="#94a3b8" font-size="11">Connect Any EVM Wallet</text>
    <text x="95" y="115" text-anchor="middle" fill="#34d399" font-size="10">Select Source Chain</text>
    <text x="95" y="135" text-anchor="middle" fill="#34d399" font-size="10">(e.g. Base, Arbitrum, OP)</text>
  </g>

  <line x1="250" y1="515" x2="280" y2="515" stroke="#34d399" stroke-width="2" marker-end="url(#arrow)"/>

  <g transform="translate(285, 420)">
    <rect x="0" y="0" width="190" height="190" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
    <circle cx="95" cy="35" r="20" fill="#064e3b"/>
    <text x="95" y="40" text-anchor="middle" fill="#6ee7b7" font-size="14" font-weight="bold">2</text>
    <text x="95" y="75" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="bold">Burn USDC (CCTP)</text>
    <text x="95" y="95" text-anchor="middle" fill="#94a3b8" font-size="11">Sign depositForBurn()</text>
    <text x="95" y="115" text-anchor="middle" fill="#34d399" font-size="10">0.024 USDC Gas Calibrated</text>
    <text x="95" y="135" text-anchor="middle" fill="#34d399" font-size="10">Emits CCTP Message</text>
  </g>

  <line x1="475" y1="515" x2="505" y2="515" stroke="#34d399" stroke-width="2" marker-end="url(#arrow)"/>

  <g transform="translate(510, 420)">
    <rect x="0" y="0" width="190" height="190" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
    <circle cx="95" cy="35" r="20" fill="#064e3b"/>
    <text x="95" y="40" text-anchor="middle" fill="#6ee7b7" font-size="14" font-weight="bold">3</text>
    <text x="95" y="75" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="bold">Circle Attestation</text>
    <text x="95" y="95" text-anchor="middle" fill="#94a3b8" font-size="11">Circle Iris API Poll</text>
    <text x="95" y="115" text-anchor="middle" fill="#34d399" font-size="10">Fetches Proof Signature</text>
    <text x="95" y="135" text-anchor="middle" fill="#34d399" font-size="10">Sponsors Mint Gas</text>
  </g>

  <line x1="700" y1="515" x2="730" y2="515" stroke="#34d399" stroke-width="2" marker-end="url(#arrow)"/>

  <g transform="translate(735, 420)">
    <rect x="0" y="0" width="190" height="190" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
    <circle cx="95" cy="35" r="20" fill="#064e3b"/>
    <text x="95" y="40" text-anchor="middle" fill="#6ee7b7" font-size="14" font-weight="bold">4</text>
    <text x="95" y="75" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="bold">Arc Settlement</text>
    <text x="95" y="95" text-anchor="middle" fill="#94a3b8" font-size="11">ArcWatcher Detects Log</text>
    <text x="95" y="115" text-anchor="middle" fill="#34d399" font-size="10">Matches Sub-Cent Nonce</text>
    <text x="95" y="135" text-anchor="middle" fill="#34d399" font-size="10">Invoice Marked PAID</text>
  </g>
</svg>
